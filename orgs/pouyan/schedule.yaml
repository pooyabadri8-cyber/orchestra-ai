# کارهای روزانهٔ خودکار. فقط وقتی «ربات کنترل» روشن است (run_service.bat) اجرا می‌شوند.
# هر مورد فقط محتوا را آماده می‌کند و برای تأیید در ربات می‌فرستد؛ بدون تأیید شما چیزی منتشر نمی‌شود.
# time به وقت تهران است. days: sat sun mon tue wed thu fri
schedule:
  - name: market_close
    time: "12:45"
    days: [sat, sun, mon, tue, wed]
    request: "گزارش پایان بازار امروز را برای همهٔ کانال‌ها آماده کن"
    enabled: true
  # خلاصهٔ خبرهای موثر بر بازار (کارمند پژوهش). پیش از روشن کردن، منبع‌های research.yaml را با capture_sources.bat بیازمایید.
  - name: news_digest
    time: "08:30"
    days: [sat, sun, mon, tue, wed, thu]
    request: "خلاصهٔ مهم‌ترین خبرهای موثر بر بازار را برای همهٔ کانال‌ها آماده کن"
    enabled: false
