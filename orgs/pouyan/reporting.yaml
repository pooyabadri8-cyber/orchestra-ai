# گزارش عملکرد تیم (کارمند گزارش‌گیری): هر هفته خودکار در ربات کنترل فرستاده می‌شود.
# هر وقت خواستید در ربات بزنید /report (هفت روز گذشته)، /report امروز یا /report 30 (سی روز گذشته).
# گزارش فقط برای شماست و هرگز در کانال منتشر نمی‌شود. برای خاموش کردن گزارش خودکار، بخش weekly را حذف کنید.
weekly:
  day: fri          # sat sun mon tue wed thu fri
  time: "20:00"     # به وقت تهران
  days: 7           # گزارش چند روز گذشته (تا همان روز)
