# CRM ساده: سرنخ‌های تامین مالی از «ربات پذیرش» عمومی، و پیگیری‌شان در ربات کنترل.
# ربات پذیرش یک ربات جداست (نه ربات کنترل): در @BotFather (تلگرام یا بله) بسازید و توکنش را در .env با نام token_env بنویسید.
# پیوند آن را زیر پست‌ها یا در footer_links فایل brand.yaml بگذارید، مثلاً https://t.me/نام_ربات?start=channel
# (هر چیزی بعد از ?start= منشأ سرنخ را نشان می‌دهد و در گزارش می‌آید.)
# اطلاعات سرنخ‌ها هرگز به مدل زبانی داده نمی‌شود و فقط در پایگاه‌دادهٔ همین کامپیوتر است.
org_id: pouyan

intake:
  platform: bale                    # bale یا telegram
  token_env: ORCHESTRA_INTAKE_BOT_TOKEN
  welcome: |-
    سلام! این ربات پذیرش «پویان کراد»، سکوی تامین مالی جمعی کارگزاری پویان است.
    با چند سؤال کوتاه درخواست تامین مالی شرکت شما ثبت می‌شود و کارشناس پذیرش با شما تماس می‌گیرد.
    ارسال درخواست رایگان است و هیچ تعهدی برای طرفین ایجاد نمی‌کند.
  consent: اطلاعاتی که می‌نویسید فقط برای تماس کارشناس پذیرش پویان کراد با شما استفاده می‌شود.
  done: درخواست شما ثبت شد ✅ کارشناس پذیرش پویان کراد به‌زودی با شما تماس می‌گیرد.
  questions:
    - {id: company, label: شرکت, ask: "نام شرکت را بنویسید."}
    - {id: contact_name, label: نام, ask: "نام و نام خانوادگی خودتان را بنویسید."}
    - {id: phone, label: تلفن, ask: "شمارهٔ تماس (موبایل یا ثابت با کد شهر) را بنویسید.", kind: phone}
    - {id: amount, label: مبلغ, ask: "حدود مبلغ تامین مالی مورد نیاز؟ (مثلاً ۲۰ میلیارد تومان)"}
    - {id: activity, label: زمینهٔ فعالیت, ask: "زمینهٔ فعالیت شرکت و کاربرد این سرمایه را کوتاه بنویسید."}

stages:
  - {id: new, name_fa: جدید}
  - {id: contacted, name_fa: تماس گرفته شد}
  - {id: evaluating, name_fa: در ارزیابی}
  - {id: submitted, name_fa: ثبت در فرابورس}
  - {id: funded, name_fa: تامین شد, final: true}
  - {id: lost, name_fa: منتفی, final: true}

follow_up_hours: 24        # سرنخ «جدید»ی که تا این‌قدر تماس نگرفته باشد، یادآوری می‌شود
max_leads_per_day: 3       # از هر نفر در ۲۴ ساعت (جلوگیری از هرزنامه)
