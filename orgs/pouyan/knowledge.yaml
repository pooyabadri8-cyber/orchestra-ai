# پایگاه دانش پویان: تنها واقعیت‌هایی که پست‌های موضوعی و برنامهٔ محتوا اجازهٔ گفتنشان را دارند.
# برگرفته از customers/pouyan/knowledge/pouyancrowd.md نسخهٔ قبلی.
#
# - topics: موضوع‌هایی که می‌شود درباره‌شان پست ساخت. در title، brief و notes «عدد» ننویسید.
# - facts: هر عدد اینجاست، با واحدش (IRT = تومان، percent = درصد، count = تعداد). نویسنده عدد را خودش تایپ نمی‌کند؛
#   کد آن را از همین فایل در متن می‌گذارد. topics هر واقعیت می‌گوید در کدام موضوع‌ها به نویسنده نشان داده شود.
# - چیزی که هنوز نامشخص است (سقف تامین مالی هر طرح، کارمزد، مدت ارزیابی تا عرضه، فهرست شش نوع وثیقه، عنوان مراحل،
#   مدارک لازم) اینجا نیامده و نویسنده اجازهٔ گفتنش را ندارد. وقتی مشخص شد، همین‌جا اضافه کنید.
# - نام ضامن‌ها عمداً نیامده: یکی از آن‌ها «صندوق» است و قاعدهٔ موضوع ممنوع (صندوق‌ها) پست را متوقف می‌کرد.
org_id: pouyan

topics:
  - id: crowd_intro
    title: معرفی پویان کراد
    brief: پویان کراد چیست، برای چه کسی است و چه تفاوت ساختاری‌ای دارد.
    notes:
      - پویان کراد سکوی تامین مالی جمعی کارگزاری پویان است و از شرکت فرابورس ایران مجوز دارد.
      - مخاطب اصلی، مدیران و صاحبان شرکت‌های تولیدی، بازرگانی و خدماتی هستند که به سرمایهٔ در گردش نیاز دارند.
      - ایدهٔ کلیدی این است که شرکت سرمایهٔ در گردش خود را از بازار سرمایه تامین کند؛ بدون واگذاری سهام و بدون ورود به صف تسهیلات، از جامعه‌ای از سرمایه‌گذاران خرد.
      - تمایز ساختاری این است که سکو و نهاد مالی زیر یک سقف هستند؛ سکو متعلق به همان کارگزاری پویان است که نهاد مالی ناظر هم هست، یعنی یک طرف پاسخگو و یک زنجیرهٔ تصمیم. این را واقعیت ساختاری بگو، نه ادعای «سریع‌تر بودن».

  - id: crowd_track_record
    title: کارنامهٔ پویان کراد
    brief: طرح‌هایی که تاکنون روی پویان کراد عرضه شده و نتیجهٔ تامین مالی آن‌ها.
    notes:
      - هر طرحی که تاکنون روی پویان کراد عرضه شده، کامل تامین مالی شده است.
      - سود همیشه «سود پیش‌بینی‌شده» است، نه سود قطعی یا تضمین‌شده.
      - سود طرح‌ها به‌صورت فصلی پرداخت می‌شود.
      - حجم ما از بزرگ‌ترین سکوهای بازار کوچک‌تر است؛ با عدد مطلق رقابت نکن و هیچ سکوی دیگری را نام نبر یا مقایسه نکن.

  - id: crowd_concerns
    title: رفع ابهام دربارهٔ تامین مالی جمعی
    brief: پاسخ به سه نگرانی رایج متقاضی، یعنی وثیقه، زمان و از دست دادن سهام.
    notes:
      - نگرانی وثیقه، انواع مختلف ضمانت پذیرفته می‌شود و فقط ضمانت‌نامهٔ بانکی نیست. فهرست انواع وثیقه را ننویس.
      - نگرانی زمان، مدت ارزیابی تا عرضه اعلام نشده است؛ دربارهٔ آن عدد یا تخمین نده.
      - نگرانی سهام، سهامداری شرکت دست‌نخورده می‌ماند. ابزار مبتنی بر بدهی است، نه سهام؛ سرمایه‌گذار «گواهی شراکت» می‌گیرد، نه سهم.

  - id: crowd_path
    title: مسیر تامین مالی در پویان کراد
    brief: مسیر تامین مالی از پذیرش تا تسویه، در سه فاز.
    notes:
      - فاز پذیرش، هنوز هیچ چیز عمومی نشده است.
      - فاز عرضه، با «ثبت در فرابورس» آغاز می‌شود که نقطهٔ کنترلی مسیر است؛ از این لحظه طرح عمومی و روی سامانهٔ فرابورس قابل استعلام است. تا پیش از آن هیچ وجهی جمع‌آوری نمی‌شود.
      - فاز اجرا و تسویه، پایان مسیر است.
      - عنوان تک‌تک مراحل در این پایگاه دانش نیست؛ فقط ساختار فازها و نقطهٔ کنترلی را بگو.

  - id: crowd_projects
    title: معرفی طرح‌های عرضه‌شده در پویان کراد
    brief: معرفی یک یا چند طرح عرضه‌شده با نماد، مبلغ، سود پیش‌بینی‌شده و وضعیت تامین.
    notes:
      - طرح پویان‌شرق و طرح پویان‌کار متعلق به شرکت کیمیا تجهیز کاران ترنم شرق هستند.
      - طرح پویان‌چوب متعلق به گروه صنعتی نوین چوب و صنعت آسیا است.
      - هر سه طرح کامل تامین مالی شده‌اند و سودشان به‌صورت فصلی پرداخت می‌شود.
      - سود همیشه «سود پیش‌بینی‌شده» است، نه سود قطعی یا تضمین‌شده. توصیه به سرمایه‌گذاری نکن.

  - id: crowd_cta
    title: دعوت به ثبت درخواست تامین مالی
    brief: دعوت مدیران شرکت‌ها به ثبت درخواست تامین مالی در پویان کراد.
    notes:
      - جمله‌های مجاز برای دعوت، «ثبت درخواست تامین مالی» و «گفت‌وگو با کارشناس پذیرش» است.
      - ارسال درخواست رایگان است و هیچ تعهدی برای طرفین ایجاد نمی‌کند.
      - نشانی سایت و تلفن را ننویس؛ قالب کانال آن‌ها را زیر پست می‌گذارد.

