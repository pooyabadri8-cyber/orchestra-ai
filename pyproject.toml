[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra-ai"
version = "0.1.0"
description = "ORCHESTRA AI: multi-agent content operations platform"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.1",
  "httpx[socks]>=0.27",
  "beautifulsoup4>=4.12",
  "dbos>=2.1,<3",
  "PyYAML>=6.0",
  "numpy>=1.26",
  "playwright>=1.44",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[tool.setuptools.packages.find]
include = ["orchestra*"]

[tool.setuptools.package-data]
"orchestra.visual" = ["fonts/*.woff2", "fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
