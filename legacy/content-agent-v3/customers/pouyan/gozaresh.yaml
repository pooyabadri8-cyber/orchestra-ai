# تنظیمات «گزارش روزانهٔ بازار» (دستور /gozaresh). مستقل از config.yaml و بقیهٔ ربات است.
# بعد از تغییر این فایل، ربات را ری‌استارت کنید.

url: "https://bourse-trader.ir/"     # منبع داده (صفحهٔ اصلی بورس‌تریدر)
top_n: 5                              # از هر فهرست (سهم / گروه) چند مورد بیاید (۱ تا ۱۵)
persian_digits: true                  # نمایش عددها با ارقام فارسی

# در این روزها گزارش «خودکار» ارسال نمی‌شود (بازار تعطیل است). گزارش دستی همیشه کار می‌کند.
# نام روزها: mon tue wed thu fri sat sun
off_weekdays: [thu, fri]

# ساعت‌های پیش‌فرض برای همهٔ OWNER_IDSها (به وقت timezone در config.yaml). خالی = هیچ.
# هر کس با دستور «/gozaresh 10:30 13:00» ساعت‌های خودش را جدا تعیین می‌کند و این مقدار را نادیده می‌گیرد.
default_times: []

state_file: "data/gozaresh.json"      # ساعت‌های انتخابی افراد اینجا ذخیره می‌شود
