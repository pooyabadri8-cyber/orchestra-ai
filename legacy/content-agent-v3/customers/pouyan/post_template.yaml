# قالب ثابت پست‌های کانال (الهام‌گرفته از قالب کارگزاری اعتبار تابان).
# مدل فقط «تیتر، بندها، فراخوان و یک هشتگ موضوع» را می‌نویسد؛ هشتگ برند و پاورقی را خود ربات ثابت اضافه می‌کند.
# بعد از تغییر این فایل، ربات را ری‌استارت کنید.

brand_hashtag: "#کارگزاری_پویان"        # همیشه اولین هشتگ
default_topic_hashtag: "#بازار_سرمایه"   # اگر مدل هشتگ موضوع ننوشت
headline_bold: true                       # تیتر (📌) پررنگ باشد؟

# فراخوان (☝): اگر مدل فراخوان ننوشت، این جملهٔ عمومی می‌آید (بدون تبلیغ پویان کراد).
# لینک پویان کراد را مدل فقط در پست‌های مرتبط با تامین مالی خودش در فراخوان می‌گذارد.
