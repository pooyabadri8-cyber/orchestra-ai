# منابعی که ربات از آن‌ها مطلب می‌خواند، (در صورت نیاز) به فارسی روان ترجمه و به سبک کانال بازنویسی می‌کند.
# هر مطلب جدید به صورت «پیش‌نویس با ذکر منبع» برای تأیید شما می‌آید؛ بدون تأیید شما منتشر نمی‌شود.
# بعد از تغییر این فایل، ربات را ری‌استارت کنید.
#
# انواع منبع (type):
#   rss               فید سایت (بهترین حالت)
#   links             صفحهٔ اخبار/خانهٔ یک سایت: لینک مقاله‌ها جمع و هر مقالهٔ جدید خوانده می‌شود
#   web               یک مقالهٔ مشخص
#   telegram          کانال «عمومی» تلگرام (فقط channel)
#   telegram_account  کانال یا «گروه» تلگرام از طریق حساب خودتان (نیاز به login_telegram.py؛ راهنما در README)
#
# گزینه‌های اختیاری هر منبع:
#   topics     موضوع‌ها به ترتیب اولویت. فقط مطلب‌هایی که دربارهٔ این موضوع‌ها باشند عبور می‌کنند
#              و موضوع بالاتر زودتر نوشته می‌شود. بدون topics همهٔ مطلب‌ها عبور می‌کنند.
#   focus      دستور ویژه برای مدل: چه چیزی «مهم» حساب می‌شود
#   priority   عدد کوچک‌تر = زودتر (پیش‌فرض ۵)
#   pattern    (links) عبارت regex که آدرس مقاله‌ها باید داشته باشند
#   pillar     محور محتوایی از config.yaml
#   link       false = در خط منبع لینک نگذار (برای گروه‌های خصوصی)
#   images     false = از عکس‌های این منبع استفاده نشود (مثلاً کانالی که روی همهٔ عکس‌هایش لوگوی خودش را گذاشته)

sources:
  # ---- کانال‌های عمومی تلگرام دربارهٔ بازار سرمایه (بدون نیاز به ورود حساب)
  # (کانال‌های «ترید فاند» و «فاندوستینگ» حذف شدند چون فقط دربارهٔ صندوق‌ها بودند)
  # (غیرفعال) کانال «کدال ۷۲۴» بیشتر اطلاعیه و گزارش تک‌تک نمادهاست و پست دربارهٔ سهم‌ها متوقف شده است.
  # اگر دوباره خواستید، علامت # اول خط‌ها را بردارید.
  # - name: "کدال ۷۲۴"
  #   type: telegram
  #   channel: "C0dal724"
  #   priority: 1
  #   min_chars: 60              # پست‌های این کانال کوتاه‌اند و بیشتر نمودار
  #   focus: >
  #     فقط گزارش‌های متنی مهم بازار: گزارش بازار روز، اطلاعیه‌ها و خبرهای کدال، تحلیل جریان پول سهم‌ها و گروه‌های صنعت. تبلیغ وبینار، معرفی ربات یا کانال، پیام‌های بدون محتوای خبری و سیگنال خرید و فروش را
  #     SKIP کن. هر چیزی دربارهٔ صندوق‌های سرمایه‌گذاری (گزارش، سبد، ورود و خروج پول صندوق‌ها) را هم SKIP کن.
  #     عددها را دقیق و به‌صورت گزارش بنویس، نه توصیه. نام کانال منبع را ننویس.

  - name: "بتا سهم"
    type: telegram
    channel: "betasahm1"
    priority: 2
    images: false      # عکس‌های این کانال معمولاً لوگو و نام خودش را دارند؛ اگر می‌خواهید عکسشان هم بیاید، true کنید
    focus: >
      فقط خبرهای مهم و تأییدشدهٔ کل بازار: مصوبات و اطلاعیه‌های رسمی سازمان بورس و بانک مرکزی، قوانین و
      مقررات جدید، تصمیم‌های اقتصادی و قیمت کامودیتی‌ها (نفت، طلا، مس). خبر و تحلیل یک سهم یا نماد مشخص، اطلاعیهٔ
      کدال شرکت‌ها، هر چیز دربارهٔ صندوق‌ها، شایعه و خبر تأییدنشده، سیگنال خرید و فروش، تبلیغ، معرفی شرکت مشاور
      و شمارهٔ تماس را SKIP کن. اگر پست فهرست یا جدول قیمت است، همهٔ ردیف‌های مهم را کامل بیاور.

  # ---- اخبار مهم بازار سرمایه از سنا
  # اگر فید دارد، بهتر است «type: rss» و آدرس فید را بگذارید؛ برای پیدا کردنش در ربات: /probe https://sena.ir
  - name: "سنا"
    type: links
    url: "https://sena.ir"
    max_links: 20
    priority: 1
    focus: >
      فقط اخبار مهم بازار سرمایه که به مخاطبان کانال (شرکت‌های متقاضی تامین مالی، فعالان بازار سرمایه) مربوط است:
      مصوبات و بخشنامه‌های سازمان بورس، تامین مالی جمعی، تامین مالی شرکت‌ها، قوانین و مقررات جدید.
      خبر یک سهم یا نماد مشخص، اخبار روزمرهٔ نمادها، هر چیز دربارهٔ صندوق‌ها، خبرهای تکراری، حاشیه و تبلیغ را SKIP کن.
      توصیهٔ خرید و فروش نده.

  # ---- طلا، نقره، مس (انگلیسی ← فارسی روان)
  # سایت goldmansachs.com دسترسی ربات‌ها را با خطای 403 می‌بندد و فید رسمی هم ندارد؛ پس برای دور نزدن
  # محدودیتش، به‌جایش از فید Mining.com استفاده می‌شود که خبر و تحلیل طلا، نقره و مس (از جمله پیش‌بینی
  # بانک‌هایی مثل گلدمن ساکس) را کامل منتشر می‌کند. اگر این منبع را نمی‌خواهید، این بلوک را پاک کنید.
  - name: "Mining.com"
    type: rss
    url: "https://www.mining.com/feed/"
    priority: 2
    topics:
      - name: "طلا"
        keywords: ["gold", "bullion"]
      - name: "نقره"
        keywords: ["silver"]
      - name: "مس"
        keywords: ["copper"]
    focus: >
      فقط اگر مطلب یک خبر یا تحلیل مهم دربارهٔ قیمت، پیش‌بینی، عرضه و تقاضا یا بازار طلا، نقره یا مس است بنویس
      (تغییر پیش‌بینی قیمت، گزارش بانک‌ها و مؤسسه‌ها، رویداد بزرگ بازار). خبر معدن و شرکت‌های کوچک،
      افتتاح پروژه، مطلب تبلیغاتی و موضوع‌های دیگر را SKIP کن. عدد، درصد، قیمت هدف، تاریخ و نام مؤسسهٔ
      تحلیلگر (مثلاً گلدمن ساکس) را دقیق از متن بگیر و دیدگاه را «از نظر <نام مؤسسه>» بنویس، نه قطعیت.
      ترجمهٔ فارسی روان و طبیعی باشد.

  # ---- (غیرفعال) Goldman Sachs: پاسخ HTTP 403 می‌دهد و ربات اجازهٔ دور زدنش را ندارد.
  # اگر روزی فید رسمی یا اجازهٔ دسترسی داشتید، با type: rss و آدرس فید اینجا اضافه کنید.

  # ---- گروه/کانال تلگرام با حساب خودتان (بعد از اجرای login_telegram.py، علامت # اول خط‌ها را بردارید)
