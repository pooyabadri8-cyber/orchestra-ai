  #   priority: 3
  #   link: false                  # برای گروه خصوصی لینک ندهد (فقط «منبع: نام گروه»)
  #   focus: >
  #     فقط خبرهای مهم و تازه دربارهٔ بازار سرمایه، تامین مالی و فلزات گران‌بها. گپ، تبلیغ، سوال و
  #     نظرهای شخصی را SKIP کن و اسم اعضای گروه را ننویس.

