# تنظیمات غیرمحرمانهٔ agent. توکن‌ها و کلیدها در .env هستند.

# نام برند/کانال در profile.yaml است (organization.name)

# مدل Claude برای نوشتن پست‌ها (اگر از مدل رایگان استفاده می‌کنید، مدل را در .env با LLM_MODEL بدهید)
model: "claude-sonnet-5-5"

# منطقهٔ زمانی همهٔ زمان‌هایی که شما وارد می‌کنید و ربات نمایش می‌دهد
timezone: "Asia/Tehran"

# ساعت‌های پیش‌فرض انتشار (به وقت timezone بالا). /plan و دکمهٔ «تأیید» از این‌ها استفاده می‌کنند.
post_times: ["11:45", "19:00"]   # ساعت پست‌های منابع؛ با ساعت‌های جدول محتوا (daily.yaml) تداخل نکند

# حداکثر طول متن هر پست (کاراکتر). حد تلگرام ۴۰۹۶ است.
max_chars: 1200

# پست‌هایی که از منبع بازنویسی می‌شوند می‌توانند بلندتر باشند تا نکتهٔ مهمی حذف نشود (سقف تلگرام ۴۰۹۶)
source_max_chars: 2500

# سقف طول خروجی مدل (توکن). مدل‌های «متفکر» بخشی از آن را صرف فکر کردن می‌کنند؛ عدد کم = پست ناقص.
# اگر خروجی بریده شود، ربات خودکار با دو برابر این عدد دوباره تلاش می‌کند و پست ناقص نمی‌سازد.
max_output_tokens: 6000

# محورهای محتوایی؛ /plan پست‌ها را بین این محورها پخش می‌کند.
pillars:
  - name: "اثبات و کارنامه"
    brief: "آمار و نماد طرح‌های عرضه‌شده؛ نرخ تکمیل ۱۰۰٪؛ فقط اعداد موجود در پایگاه دانش"
  - name: "رفع ابهام"
    brief: "پاسخ به سه نگرانی اصلی: وثیقه، زمان، از دست دادن سهام"
  - name: "مسیر تامین مالی"
    brief: "مسیر ۸ مرحله‌ای در ۳ فاز؛ نقطهٔ کنترلی ثبت در فرابورس"
  - name: "تمایز پویان کراد"
    brief: "سکو و نهاد مالی زیر یک سقف؛ سهامداری دست‌نخورده؛ تنوع ضمانت"
  - name: "معرفی طرح"
    brief: "معرفی یکی از سه طرح عرضه‌شده با نماد، مبلغ، ضامن و وضعیت"
  - name: "فراخوان"
    brief: "دعوت به ثبت درخواست تامین مالی؛ ارسال درخواست رایگان و بدون تعهد است"

# ---- منابع خارجی (فایل sources.yaml)
sources_file: "sources.yaml"
source_poll_hours: 0.33   # هر چند ساعت منابع خودکار بررسی شوند (۰.۳۳ = هر ۲۰ دقیقه؛ ۰ = خاموش، فقط با /fetch)
max_new_per_poll: 1       # حداکثر پست در هر بار بررسی (یعنی حداکثر یک پست منبع در هر ۲۰ دقیقه)
max_age_days: 3           # مطلب‌های قدیمی‌تر از این نادیده گرفته می‌شوند
attribution: false        # خط «منبع: …» زیر پست‌ها نوشته نشود

# ---- حالت خودکار
# true  = پست‌های ساخته‌شده از منابع بدون تأیید شما در کانال منتشر می‌شوند
#         (پستی که بررسی خودکار آن را مشکوک بداند، منتشر نمی‌شود و برای تأیید شما می‌آید)
# false = مثل قبل: هر پست اول برای تأیید شما می‌آید
auto_publish: true
# سطح تأیید: review = همه‌چیز با تأیید شما | trusted = فقط منبع‌های دارای «trusted: true» در sources.yaml خودکار | auto = همه خودکار
approval: auto
# انتشار قابل‌اتکا: خطای موقت (قطعی شبکه، محدودیت سرعت) با این فاصله‌ها (ثانیه) دوباره تلاش می‌شود؛ بعد از این تعداد تلاش، پست به صف خطا (/dead) می‌رود
max_publish_attempts: 4
retry_delays: [30, 120, 600]
auto_max_queue: 4         # حداکثر تعداد پست در انتظار انتشار
# فاصلهٔ هر دو پست کانال، حداقل این‌قدر دقیقه است (۲۰ = حداکثر هر ۲۰ دقیقه یک پست) (پست‌های جدول محتوا سر ساعت خودشان می‌آیند و پست‌های منابع
# دور آن‌ها جا باز می‌کنند؛ یعنی بین پست منبع و پست جدول هم همین فاصله هست).
auto_gap_minutes: 20
# سقف پست از منابع در هر روز (پست‌های جدول محتوا جدا حساب می‌شوند). ۰ = بدون سقف
auto_max_per_day: 9
# پست‌های منابع فقط داخل این بازه منتشر می‌شوند؛ ۰۸:۳۰ یعنی روز با پست خبری جدول شروع می‌شود (خالی = شبانه‌روز)
auto_from: "08:30"
auto_to: "23:00"

# ---- عکس پست‌ها
# پستی که از یک خبر ساخته می‌شود و خبر عکس خودش را دارد (عکس شاخص مقاله، عکس پست تلگرام، تصویر فید)، می‌تواند با همان عکس
# منتشر شود و متن پست «کپشن» عکس است. کپشن عکس حداکثر ۱۰۲۴ کاراکتر است؛ برای این پست‌ها متن کوتاه‌تر نوشته می‌شود.
# اگر متن باز هم بلندتر شد یا عکس مشکل داشت، پست بدون عکس منتشر می‌شود (هیچ پستی به‌خاطر عکس از دست نمی‌رود).
images: true
image_ratio: 0.5          # حدود چند درصد از پست‌های دارای عکس، با عکس منتشر شوند (۱ = همه، ۰ = هیچ‌کدام)
image_min_width: 400      # عکس‌های کوچک‌تر (آیکون، لوگو، بندانگشتی) استفاده نمی‌شوند
# image_dir: "data/images"
# caption_max_chars: 1024

# ---- موضوع‌های ممنوع (دیگر دربارهٔ صندوق‌های سرمایه‌گذاری پست نمی‌گذاریم)
# اگر هر کدام از این کلمه‌ها در عنوان یک مطلب بیاید (یا در متنش سه بار) مطلب اصلاً به مدل داده نمی‌شود؛ ردیف‌های
# «صندوق ...» از گزارش‌های بازار و تحلیل نماد حذف می‌شوند؛ و پستی که تیترش یا متنش (دو بار یا بیشتر) این کلمه‌ها را
# داشته باشد خودکار منتشر نمی‌شود. برای خاموش کردن کامل: exclude_words: []
exclude_words: ["صندوق", "ETF", "فاند", "fund"]
# نمادهایی که صندوق هستند ولی اسمشان «صندوق» ندارد (مثلاً نمادهای ETF که در فهرست ورود پول می‌آیند).
# نام را دقیقاً همان‌طور که در گزارش بازار نوشته می‌شود بنویسید. مثال: ["اهرم", "کیان"]
exclude_symbols: []
# عبارت‌هایی که کلمهٔ «صندوق» دارند ولی صندوق سرمایه‌گذاری نیستند (خبر آن‌ها حذف نمی‌شود)
exclude_ignore:
  - "صندوق بین‌المللی"
  - "صندوق بین المللی"
  - "صندوق توسعه ملی"
  - "صندوق ذخیره ارزی"
  - "صندوق ذخیره"
  - "صندوق بازنشستگی"
  - "صندوق‌های بازنشستگی"
  - "صندوق پول"
  - "صندوق ضمانت"
  - "صندوق تامین اجتماعی"
  - "Monetary Fund"
  - "Sovereign Wealth Fund"
  - "wealth fund"
  - "pension fund"

db_path: "data/agent.db"
knowledge_dir: "knowledge"
