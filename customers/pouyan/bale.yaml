# قالب‌بندی متن برای پیام‌رسان «بله» (فقط وقتی platform: bale باشد خوانده می‌شود).
# بله پارامتر parse_mode ندارد و متن را همیشه «مارک‌داون» می‌خواند؛ ربات پست‌های HTML خودش را به آن تبدیل می‌کند.
# بعد از هر تغییر، ربات را ری‌استارت کنید و در بله دستور /balecheck را بزنید تا نمونه را ببینید.

markdown: true        # false = همه‌چیز متن ساده (هیچ پررنگی و لینکِ قابل کلیک ندارد، ولی خراب هم نمی‌شود)
bold: "*"             # علامت دور متن پررنگ؛ اگر پررنگ درست کار نکرد، "" بگذارید (بدون پررنگ)
italic: "_"           # علامت کج‌نویسی (ربات فعلاً از آن استفاده نمی‌کند)
links: markdown       # markdown = [متن](آدرس)   |   plain = متن (آدرس)
underscore: keep      # اگر هشتگ‌های دارای _ خراب شدند: escape یا zwnj را امتحان کنید
